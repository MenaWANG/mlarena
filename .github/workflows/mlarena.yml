name: Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [created]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        mlflow: [minimum, latest]
    env:
      MPLBACKEND: Agg
      MLFLOW_DISABLE_TELEMETRY: "true"

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install poetry
        poetry install --with dev
        poetry run pip install lightgbm

    - name: Install minimum supported MLflow
      if: matrix.mlflow == 'minimum'
      run: poetry run pip install "mlflow==3.16.0"

    - name: Install latest supported MLflow
      if: matrix.mlflow == 'latest'
      run: poetry run pip install --upgrade "mlflow>=3.16.0,<4"

    - name: Verify dependency consistency
      run: |
        poetry run pip check
        poetry run python -c "import mlflow; print('Testing MLflow', mlflow.__version__)"

    - name: Code quality checks
      run: |
        poetry run black . --check
        poetry run isort . --check

    - name: Run tests
      run: |
        poetry run pytest --cov=mlarena --cov-report=term-missing

  publish:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'created'

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"  # Using Python 3.11 for publishing since it's a stable version
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install poetry
        poetry install --with dev
        poetry run pip install lightgbm

    - name: Build and publish
      env:
        PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
      run: |
        poetry config pypi-token.pypi $PYPI_TOKEN
        poetry build
        poetry publish
